[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finops-governor"
version = "0.1.0"
description = "An agentic system for validating and estimating synthetic data generation pipelines."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hamza AlJundi" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "usd-core>=25",
    "anthropic>=0.40",
    "mypy>=1.14",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finops_governor"]
[tool.mypy]
files = ["src"]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "pxr.*"
ignore_missing_imports = true
