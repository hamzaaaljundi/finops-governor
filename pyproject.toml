[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finops-governor"
version = "1.0.0"
description = "Pre-flight gate for training-value-per-GPU-dollar in synthetic-data pipelines: an LLM plans, a deterministic multi-axis gate decides - budget, expected-coverage diversity, and USD geometric validity - before any GPU spend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Hamza Al Jundi" }]
keywords = [
    "finops",
    "synthetic-data",
    "gpu-cost",
    "domain-randomization",
    "openusd",
    "digital-twin",
    "llm-governance",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.0",
    "usd-core>=25",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.15.21",
    "mypy>=1.14",
    "httpx2",
]

[project.scripts]
finops-governor = "finops_governor.cli:main"

[project.urls]
Repository = "https://github.com/hamzaaaljundi/finops-governor"
Documentation = "https://github.com/hamzaaaljundi/finops-governor/tree/main/docs"
Changelog = "https://github.com/hamzaaaljundi/finops-governor/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/finops_governor"]

[tool.ruff]
line-length = 100
extend-exclude = ["session_kit/scripts", "session_kit_s4/scripts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "pxr.*"
ignore_missing_imports = true
