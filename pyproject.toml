[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finops-governor"
version = "0.1.0"
description = "An agentic system for validating and estimating synthetic data generation pipelines."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hamza AlJundi" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finops_governor"]